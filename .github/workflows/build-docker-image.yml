name: Build Image

on:
  push:
    branches:
      - extensions

permissions:
  contents: read

jobs:
  build-netris-operator:
    runs-on: ubuntu-latest

    env:
      REGISTRY_DOMAIN: registry.ci.mirantis.com
      DOCKER_BUILD_CHECKS_ANNOTATIONS: false
      DOCKER_BUILD_SUMMARY: false
      DOCKER_BUILD_RECORD_UPLOAD: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - uses: actions/checkout@v6
        with:
          repository: k0rdent/netriswebapi
          path: netriswebapi
          ref: refs/heads/extensions
          token: ${{ secrets.NETRIS }}
          
      - name: Get versions
        id: versions
        run: |
          image_version=$(bash deploy/get_version.sh)
          echo "IMAGE_VERSION=$image_version" >> "$GITHUB_OUTPUT"
          echo "Using image version: $image_version"

      - name: Login to Mirantis CI Registry
        if: env.REGISTRY_DOMAIN == 'registry.ci.mirantis.com'
        uses: docker/login-action@v3
        with:
          registry: registry.ci.mirantis.com
          username: ${{ secrets.REGISTRY_CI_USERNAME }}
          password: ${{ secrets.REGISTRY_CI_PASSWORD }}

#      - name: Login to Mirantis Registry
#        if: env.REGISTRY_DOMAIN == 'registry.mirantis.com'
#        uses: docker/login-action@v3
#        with:
#          registry: registry.mirantis.com
#          username: ${{ secrets.REGISTRY_PROD_USERNAME }}
#          password: ${{ secrets.REGISTRY_PROD_PASSWORD }}

      - name: Set image metadata
        run: |
          timestamp=$(date +%s)
          repo_name=$(basename ${{ github.repository }})
          echo "repo_name=${repo_name}" >> $GITHUB_ENV
          echo "tag=${{ steps.versions.outputs.image_version }}.${timestamp}" >> $GITHUB_ENV

      - name: Build and push netris-operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_DOMAIN }}/k0rdent-bm/images/${{ env.repo_name }}:${{ env.tag }}
          platforms: linux/amd64
          build-args: |
            SOURCE_TAG=${{ steps.versions.outputs.image_version }}
            DOWNLOAD_NETRISWEBAPI=false
          provenance: false
          sbom: false

      - name: Print Build Summary
        run: |
          IMAGE="${{ env.REGISTRY_DOMAIN }}/k0rdent-ai/images/${{ env.repo_name }}:${{ env.tag }}"
          echo "### Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "\`${IMAGE}\`" >> $GITHUB_STEP_SUMMARY
